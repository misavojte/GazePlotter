name: CI

# Every branch push runs the full gate (check + test + build + package smoke);
# main additionally deploys to GitHub Pages, and only after the gate is green.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Supersede in-flight runs on feature branches; never cancel a main run
# (a half-cancelled deploy is worse than a queued one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No lockfile in this repo (deliberate), so the npm cache keys on
          # package.json instead and installs resolve fresh via npm i.
          cache: npm
          cache-dependency-path: package.json
      - run: npm i
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No lockfile in this repo (deliberate), so the npm cache keys on
          # package.json instead and installs resolve fresh via npm i.
          cache: npm
          cache-dependency-path: package.json
      - run: npm i
      # The npm script is watch-mode vitest; --run is the CI one-shot.
      - run: npm test -- --run

  # The npm library deliverable (svelte-package + publint), so a change that
  # breaks packaging fails the commit, not the next release.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No lockfile in this repo (deliberate), so the npm cache keys on
          # package.json instead and installs resolve fresh via npm i.
          cache: npm
          cache-dependency-path: package.json
      - run: npm i
      - run: npm run package

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No lockfile in this repo (deliberate), so the npm cache keys on
          # package.json instead and installs resolve fresh via npm i.
          cache: npm
          cache-dependency-path: package.json
      - run: npm i
      - run: npm run build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check, test, build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
